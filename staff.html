<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pannello Staff - Carta Fedeltà</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #ffffff; width: 100%; max-width: 420px; padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
    h2 { font-size: 1.4rem; color: #1a1a1a; margin-bottom: 8px; }
    p { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #444; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 10px; font-size: 1rem; outline: none; }
    .form-group input:focus { border-color: #007bff; }
    .btn { width: 100%; padding: 14px; background-color: #007bff; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    #scanner-section { display: none; }
    .operator-badge { background: #e3f2fd; color: #0d47a1; padding: 8px 12px; border-radius: 20px; font-weight: 600; font-size: 0.85rem; display: inline-block; margin-bottom: 15px; }
    #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; }
    .btn-logout { background-color: #dc3545; margin-top: 10px; }
    #msg { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <!-- FORM LOGIN STAFF -->
    <div id="login-section">
      <h2>Accesso Staff</h2>
      <p>Inserisci i tuoi dati per accreditare i punti</p>
      
      <form id="login-form" onsubmit="event.preventDefault(); window.loginStaff();">
        <div class="form-group">
          <label for="staff-id">ID Staff</label>
          <input type="text" id="staff-id" placeholder="Es. STF-01" required>
        </div>
        <div class="form-group">
          <label for="staff-password">Password</label>
          <input type="password" id="staff-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Accedi</button>
      </form>
      <div id="msg"></div>
    </div>

    <!-- PANNELLO SCANSIONE QR -->
    <div id="scanner-section">
      <div class="operator-badge">Operatore: <span id="operator-name">---</span></div>
      <h2>Inquadra Carta Cliente</h2>
      <p>Posiziona il QR Code del cliente al centro del riquadro</p>

      <div id="reader"></div>

      <button class="btn btn-logout" onclick="window.logout()">Esci / Cambia Operatore</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs, doc, updateDoc, increment, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCDe77e8Nl-p1s_68Q4jrfXdzyrPNHFBfU",
      authDomain: "carta-fedelta-web-caffe-barone.firebaseapp.com",
      projectId: "carta-fedelta-web-caffe-barone",
      storageBucket: "carta-fedelta-web-caffe-barone.firebasestorage.app",
      messagingSenderId: "498122092049",
      appId: "1:498122092049:web:6c28e9ee319f8977968bb0",
      measurementId: "G-PHXWZ9M4LX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let html5QrcodeScanner = null;
    let currentStaff = null;

    // Autenticazione Dipendente
    window.loginStaff = async () => {
      const idInput = document.getElementById('staff-id').value.trim();
      const passInput = document.getElementById('staff-password').value.trim();
      const msg = document.getElementById('msg');
      msg.innerText = "Verifica in corso...";

      const q = query(collection(db, "staff"), where("idStaff", "==", idInput));
      const querySnapshot = await getDocs(q);

      if (querySnapshot.empty) {
        msg.style.color = "red";
        msg.innerText = "ID Staff non trovato!";
        return;
      }

      let userFound = null;
      querySnapshot.forEach((doc) => { userFound = doc.data(); });

      if (userFound.password !== passInput) {
        msg.style.color = "red";
        msg.innerText = "Password errata!";
        return;
      }

      if (userFound.stato === "bloccato") {
        msg.style.color = "red";
        msg.innerText = "Utenza bloccata dall'Amministratore!";
        return;
      }

      currentStaff = userFound;
      document.getElementById('operator-name').innerText = `${currentStaff.nome} (${currentStaff.idStaff})`;
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('scanner-section').style.display = 'block';
      msg.innerText = "";

      avviaScanner();
    };

    // Avvio Fotocamera
    function avviaScanner() {
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render(onScanSuccess);
    }

    // Gestione Scansione QR Code Cliente
    async function onScanSuccess(decodedText) {
      html5QrcodeScanner.pause();
      
      try {
        const qCard = query(collection(db, "carte"), where("numeroCarta", "==", decodedText));
        const snap = await getDocs(qCard);

        if (snap.empty) {
          alert("Carta non trovata nel database!");
        } else {
          let cardRef = null;
          let clienteNome = "";

          snap.forEach((d) => {
            cardRef = doc(db, "carte", d.id);
            clienteNome = `${d.data().nome} ${d.data().cognome}`;
          });

          // Aggiunge 1 punto alla tessera
          await updateDoc(cardRef, { punti: increment(1) });

          // Registra la transazione nello storico
          await addDoc(collection(db, "transazioni"), {
            dataOra: new Date().toLocaleString("it-IT"),
            numeroCarta: decodedText,
            cliente: clienteNome,
            idStaff: currentStaff.idStaff,
            dipendente: `${currentStaff.nome} ${currentStaff.cognome}`,
            operazione: "+1 Punto"
          });

          alert(`Punto aggiunto a ${clienteNome}!`);
        }
      } catch (err) {
        alert("Errore durante l'accredito del punto.");
      }

      setTimeout(() => { html5QrcodeScanner.resume(); }, 2000);
    }

    // Logout
    window.logout = () => {
      if (html5QrcodeScanner) html5QrcodeScanner.clear();
      document.getElementById('login-section').style.display = 'block';
      document.getElementById('scanner-section').style.display = 'none';
      document.getElementById('login-form').reset();
    };
  </script>
</body>
</html>

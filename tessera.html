<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Mia Carta Fedeltà - Caffè Barone</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    
    .container { width: 100%; max-width: 360px; }
    
    .login-box {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    .login-box h2 { margin-bottom: 8px; color: #f8fafc; }
    .login-box p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; }
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: #cbd5e1; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 8px; font-size: 1rem; outline: none; }
    .btn-login { width: 100%; padding: 12px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    #login-msg { margin-top: 10px; font-size: 0.85rem; }

    #card-section { display: none; }
    
    .loyalty-card {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
      margin-bottom: 25px;
    }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card-title { font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; color: #f8fafc; }
    .card-number { font-family: monospace; font-size: 0.9rem; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 4px 8px; border-radius: 6px; }
    
    .card-holder { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .stamps-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .stamp {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }
    .stamp.active {
      background: #38bdf8;
      border-style: solid;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .qr-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      color: #0f172a;
    }
    #qrcode { display: flex; justify-content: center; margin: 10px 0 15px; }
    .qr-hint { font-size: 0.85rem; color: #64748b; font-weight: 500; }
    .btn-logout { background: transparent; border: none; color: #ef4444; margin-top: 15px; font-size: 0.85rem; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- LOGIN CLIENTE -->
    <div class="login-box" id="login-section">
      <h2>Caffè Barone</h2>
      <p>Accedi alla tua Carta Fedeltà</p>
      
      <form onsubmit="event.preventDefault(); window.loginCliente();">
        <div class="form-group">
          <label for="cliente-email">Email</label>
          <input type="email" id="cliente-email" placeholder="latua@email.it" required>
        </div>
        <div class="form-group">
          <label for="cliente-pass">Password</label>
          <input type="password" id="cliente-pass" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">Accedi</button>
      </form>
      <div id="login-msg"></div>
    </div>

    <!-- TESSERA DIGITALE -->
    <div id="card-section">
      <div class="loyalty-card">
        <div class="card-header">
          <span class="card-title">CARTA DRINK</span>
          <span class="card-number" id="card-id">#0000</span>
        </div>
        
        <div class="card-holder" id="customer-name">---</div>

        <div class="stamps-grid" id="stamps-container"></div>
      </div>

      <div class="qr-container">
        <div id="qrcode"></div>
        <p class="qr-hint">Mostra questo codice al banco per accreditare il tuo drink</p>
      </div>

      <div style="text-align: center;">
        <button class="btn-logout" onclick="window.logoutCliente()">Esci / Cambia Account</button>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCDe77e8Nl-p1s_68Q4jrfXdzyrPNHFBfU",
      authDomain: "carta-fedelta-web-caffe-barone.firebaseapp.com",
      projectId: "carta-fedelta-web-caffe-barone",
      storageBucket: "carta-fedelta-web-caffe-barone.firebasestorage.app",
      messagingSenderId: "498122092049",
      appId: "1:498122092049:web:6c28e9ee319f8977968bb0",
      measurementId: "G-PHXWZ9M4LX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let unsubscribe = null;

    // LOGIN CLIENTE
    window.loginCliente = async () => {
      const emailInput = document.getElementById("cliente-email").value.trim();
      const passInput = document.getElementById("cliente-pass").value;
      const msg = document.getElementById("login-msg");
      
      msg.style.color = "#38bdf8";
      msg.innerText = "Verifica in corso...";

      const q = query(collection(db, "carte"), where("email", "==", emailInput));
      const snapshot = await getDocs(q);

      if (snapshot.empty) {
        msg.style.color = "#ef4444";
        msg.innerText = "Email non trovata nel sistema!";
        return;
      }

      let clienteData = null;
      let cardIdTrovato = null;

      snapshot.forEach(d => {
        clienteData = d.data();
        cardIdTrovato = d.id;
      });

      if (clienteData.password !== passInput) {
        msg.style.color = "#ef4444";
        msg.innerText = "Password errata!";
        return;
      }

      // Salva sessione e carica la carta
      localStorage.setItem("cliente_card_id", cardIdTrovato);
      mostraCarta(cardIdTrovato);
    };

    function mostraCarta(cardId) {
      document.getElementById("login-section").style.display = "none";
      document.getElementById("card-section").style.display = "block";
      document.getElementById("qrcode").innerHTML = "";

      new QRCode(document.getElementById("qrcode"), {
        text: cardId,
        width: 150,
        height: 150
      });

      const cardRef = doc(db, "carte", cardId);
      unsubscribe = onSnapshot(cardRef, (snapshot) => {
        const data = snapshot.data();
        if (!data) return;

        document.getElementById("card-id").innerText = `#${data.numeroCarta}`;
        document.getElementById("customer-name").innerText = `${data.nome} ${data.cognome}`;

        const grid = document.getElementById("stamps-container");
        grid.innerHTML = "";

        const puntiAttuali = (data.punti || 0) % 10;

        for (let i = 1; i <= 10; i++) {
          const stamp = document.createElement("div");
          stamp.className = "stamp";

          if (i <= puntiAttuali) {
            stamp.classList.add("active");
            stamp.innerText = "🍹";
          } else if (i === 10) {
            stamp.innerText = "🎁";
          }

          grid.appendChild(stamp);
        }
      });
    }

    window.logoutCliente = () => {
      localStorage.removeItem("cliente_card_id");
      if (unsubscribe) unsubscribe();
      document.getElementById("login-section").style.display = "block";
      document.getElementById("card-section").style.display = "none";
      document.getElementById("cliente-email").value = "";
      document.getElementById("cliente-pass").value = "";
      document.getElementById("login-msg").innerText = "";
    };

    const savedCardId = localStorage.getItem("cliente_card_id");
    if (savedCardId) {
      mostraCarta(savedCardId);
    }
  </script>
</body>
</html>

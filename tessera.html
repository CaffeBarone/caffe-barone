<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Mia Carta Fedeltà</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    
    .card-container { width: 100%; max-width: 360px; }
    
    /* STILE CARTA FIDEALIZZAZIONE (CARTA DI CREDITO) */
    .loyalty-card {
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      position: relative;
      margin-bottom: 25px;
    }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card-title { font-size: 1.1rem; font-weight: 700; letter-spacing: 1px; color: #f8fafc; }
    .card-number { font-family: monospace; font-size: 0.9rem; color: #38bdf8; background: rgba(56, 189, 248, 0.1); padding: 4px 8px; border-radius: 6px; }
    
    .card-holder { font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
    
    /* GRIGLIA PUNTI (10 CASELLE) */
    .stamps-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .stamp {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }
    .stamp.active {
      background: #38bdf8;
      border-style: solid;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    /* SEZIONE QR CODE */
    .qr-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      color: #0f172a;
    }
    .qr-box { width: 160px; height: 160px; margin: 0 auto 12px; background: #f1f5f9; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 0.8rem; color: #64748b; }
    .qr-hint { font-size: 0.85rem; color: #64748b; font-weight: 500; }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- CARTA STILE CARTA DI CREDITO -->
    <div class="loyalty-card">
      <div class="card-header">
        <span class="card-title">CARTA DRINK</span>
        <span class="card-number" id="card-id">#0001</span>
      </div>
      
      <div class="card-holder" id="customer-name">Mario Rossi</div>

      <!-- 10 PUNTI -->
      <div class="stamps-grid">
        <div class="stamp active">🍹</div>
        <div class="stamp active">🍹</div>
        <div class="stamp active">🍹</div>
        <div class="stamp active">🍹</div>
        <div class="stamp"></div>
        <div class="stamp"></div>
        <div class="stamp"></div>
        <div class="stamp"></div>
        <div class="stamp"></div>
        <div class="stamp">🎁</div>
      </div>
    </div>

    <!-- MOSTRA QUESTO QR ALLA CASSA -->
    <div class="qr-container">
      <div class="qr-box">
        <!-- Inserisci qui il QR Code generato -->
        <span>[ QR CODE CLIENTE ]</span>
      </div>
      <p class="qr-hint">Mostra questo codice al banco per accreditare il tuo drink</p>
    </div>
  </div>

</body>
</html>
